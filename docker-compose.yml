services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - mynetwork
    env_file:
      - .env.dev
    depends_on:
      - db
    cpus: '1'
    mem_limit: 500M
    command: sh -c "sleep 5 && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
  db:
    image: postgres:14
    networks:
      - mynetwork
    env_file:
      - .env.dev
    cpus: '0.5'
    mem_limit: 500M

networks:
  mynetwork:
    driver: bridge